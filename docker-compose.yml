services:
  pinformation-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pinformation_bot
    volumes:
      - .:/app
      - /app/.venv
      - ./pinformation_bot/config:/app/pinformation_bot/config
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - LOG_LEVEL=DEBUG
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
